<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zaban chunein</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5C4A}a:hover{color:#0A4235}
</style>
</helmet>
<div dir="{{dir}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F4EE; font-family: {{font}}; color: #14201C; box-sizing: border-box; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 22px">

<a href="Profile.dc.html" aria-label="Wapas" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.7); border: 1px solid #E4E1D7; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{flip}}"><path d="M15 18l-6-6 6-6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 30px; line-height: {{lh}}; font-weight: 800">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: {{lh}}; font-weight: 500; color: #5B6660">{{sub}}</p>
</div>

<div role="radiogroup" aria-label="Zaban" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 18px; border-radius: 28px; border: 2px solid {{l.border}}; background: #FFFFFF; cursor: pointer; text-align: start">
<span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid {{l.border}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{l.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: {{l.font}}; font-size: 18px; line-height: {{l.lh}}; font-weight: 800; color: #14201C">{{l.name}}</span>
<span style="font-family: 'Manrope', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; color: #5B6660">{{l.hint}}</span>
</span>
</button>
</sc-for>
</div>

<div style="background: #0F5C4A; color: #FFFFFF; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; line-height: {{lh}}; font-weight: 700; color: #CFE3DB">{{previewLabel}}</span>
<span style="font-size: 22px; line-height: {{lh}}; font-weight: 800">{{preview}}</span>
<span style="font-size: 13px; line-height: {{lh}}; font-weight: 600; color: #E3EFEA">{{preview2}}</span>
</div>

<div style="flex: 1"></div>
<a href="Welcome.dc.html" style="height: 56px; border-radius: 28px; background: #0F5C4A; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">{{cta}}</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = (this.state && this.state.lang) || 'roman';
    const latin = "'Manrope', 'Segoe UI', sans-serif";
    const urdu = "'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif";
    const T = {
      en: { title: 'Choose language', sub: 'You can change this later from Profile.', previewLabel: 'Preview', preview: 'Next jamaat: Asr 4:45', preview2: 'Masjid-e-Noor · in 18 min', cta: 'Continue' },
      ur: { title: 'زبان منتخب کریں', sub: 'آپ اسے بعد میں پروفائل سے بدل سکتے ہیں۔', previewLabel: 'جھلک', preview: 'اگلی جماعت: عصر ۴:۴۵', preview2: 'مسجدِ نور · ۱۸ منٹ میں', cta: 'جاری رکھیں' },
      roman: { title: 'Zaban chunein', sub: 'Isay baad mein Profile se badal sakte hain.', previewLabel: 'Preview', preview: 'Agli jamaat: Asr 4:45', preview2: 'Masjid-e-Noor · 18 min mein', cta: 'Jaari rakhein' }
    };
    const defs = [
      ['roman', 'Roman Urdu', 'Urdu, English huroof mein', latin, '1.3'],
      ['ur', 'اردو', 'Urdu · daayen se baayen', urdu, '2'],
      ['en', 'English', 'English', latin, '1.3']
    ];
    const langs = defs.map((d) => {
      const on = d[0] === cur;
      return { name: d[1], hint: d[2], font: d[3], lh: d[4], on: on, border: on ? '#0F5C4A' : '#E4E1D7', dot: on ? '#0F5C4A' : 'transparent', pick: () => this.setState({ lang: d[0] }) };
    });
    const isUr = cur === 'ur';
    return Object.assign({}, T[cur], {
      langs: langs,
      dir: isUr ? 'rtl' : 'ltr',
      font: isUr ? urdu : latin,
      lh: isUr ? '2' : '1.4',
      flip: isUr ? 'scaleX(-1)' : 'none'
    });
  }
}
</script>
</body>
</html>
