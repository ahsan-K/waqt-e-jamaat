# Phase 6: with the database unreachable, the map still shows cached masjids + offline banner.
# Run after phase2-map (fills the cache) and with the RTDB emulator stopped.
appId: com.ahsan.waqtejamaat
---
- launchApp:
    stopApp: true
- openLink: "exp+waqt-e-jamaat://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_onboarding=1&__expo_disable_fab=1"
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://.*:8081"
- extendedWaitUntil:
    visible:
      id: "offline-banner"
    timeout: 60000
- runFlow: _dismiss-devmenu.yaml
- assertVisible:
    id: "nearby-seed-01"
- takeScreenshot: .maestro/out/offline
